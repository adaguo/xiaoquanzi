<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小圈子 · 使用统计</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#302d25;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#9c3d2a;text-underline-offset:4px}h1{font-size:24px;margin:12px 0}h2{font-size:18px;margin:28px 0 12px}.muted{color:#716b5d;font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:18px;background:#fffaf1;border:1px solid #d8d1c2;border-radius:10px}.value{font-size:30px;font-weight:600}.card span{display:block;font-size:14px;color:#716b5d}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #d8d1c2;white-space:nowrap}th{color:#716b5d;font-weight:500}button,.button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:8px 16px;border:1px solid #b1a894;background:#fffaf1;color:#302d25;border-radius:7px;font:inherit;cursor:pointer;text-decoration:none}[hidden]{display:none!important}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #9c3d2a;outline-offset:3px}#status{margin:18px 0}#login{padding:24px 0}#login p{max-width:38em}@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:18px 16px}.card{padding:14px}header{align-items:flex-start}}
</style><main><header><div><a href="/">小圈子</a><h1>使用统计</h1></div><button id="refresh" hidden>刷新</button></header><p class="muted">最近 7 天 · 按匿名设备统计</p><p id="status" role="status">正在读取…</p><section id="login" hidden><p>请用管理员 Azure 账号登录。</p><a class="button" href="/.auth/login/aad?post_login_redirect_uri=%2Fmetrics%2F">管理员登录</a></section><div id="content" hidden><div class="cards" id="cards"></div><h2>每日访问</h2><div class="table-wrap" id="daily"></div><h2>圈子</h2><div class="table-wrap" id="boards"></div><h2>板块</h2><div class="table-wrap" id="modules"></div><p class="muted">参与点击不等于操作成功。新建圈子只统计接入后的记录；数据可能延迟数分钟。</p><p class="muted" id="updated"></p></div></main><script>
const $=id=>document.getElementById(id);const labels={board:'黑板',wish:'许愿／任务',vote:'投票',drink:'酒水',fund:'基金'};
function table(id,rows,columns){const box=$(id);box.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='muted';p.textContent='暂无记录';box.append(p);return}const t=document.createElement('table'),head=document.createElement('tr');for(const [,title]of columns){const th=document.createElement('th');th.textContent=title;head.append(th)}const thead=document.createElement('thead');thead.append(head);t.append(thead);const body=document.createElement('tbody');for(const row of rows){const tr=document.createElement('tr');for(const [key]of columns){const td=document.createElement('td');td.textContent=key==='module'?(labels[row[key]]||row[key]):key==='day'?String(row[key]).slice(5,10):String(row[key]??0);tr.append(td)}body.append(tr)}t.append(body);box.append(t)}
async function load(){$('refresh').disabled=true;$('status').textContent='正在读取…';try{const r=await fetch('/api/metrics',{credentials:'same-origin',cache:'no-store'});if(r.status===401){const state=await r.json();if(!state.loginReady){$('login').querySelector('p').textContent='管理员登录正在配置，统计暂未开放。';$('login').querySelector('a').hidden=true;}$('content').hidden=true;$('login').hidden=false;$('refresh').hidden=true;$('status').textContent='';return}if(!r.ok)throw Error();const d=await r.json();$('login').hidden=true;$('content').hidden=false;$('refresh').hidden=false;$('cards').replaceChildren();const overview=d.overview[0]||{};for(const [key,title]of [['visitors','访问设备'],['activeDevices','进圈设备'],['activeBoards','活跃圈子'],['createdBoards','新建圈子']]){const c=document.createElement('div');c.className='card';const v=document.createElement('div');v.className='value';v.textContent=overview[key]??0;const label=document.createElement('span');label.textContent=title;c.append(v,label);$('cards').append(c)}table('daily',d.daily,[['day','日期'],['visitors','访问设备'],['entries','进圈次数']]);table('boards',d.boards,[['board','板号'],['visitors','访问设备'],['entries','进入'],['actions','参与点击'],['successes','成功操作']]);table('modules',d.modules,[['module','板块'],['views','查看设备'],['participants','参与设备'],['actions','点击'],['successes','成功']]);$('updated').textContent='更新于 '+new Date(d.updatedAt).toLocaleString();$('status').textContent=''}catch{$('status').textContent='暂时无法读取统计，请稍后刷新。';$('refresh').hidden=false}finally{$('refresh').disabled=false}}
$('refresh').addEventListener('click',load);load();
</script></html>
